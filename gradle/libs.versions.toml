[versions]
slf4j = "2.0.17"
kaributools = "0.27"
karibudsl = "2.6.0"
junit5 = "6.0.3"
# Check the newest Vaadin version at https://github.com/vaadin/platform/tags
vaadin = "25.2.3"
vaadin_spring = "25.2.1"
vaadin_next = "25.3.0-alpha6"
vaadin_next_spring = "25.2.1"
spring_boot = "4.0.5"
spring_security = "7.0.6"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
kaributools = { module = "com.github.mvysny.karibu-tools:karibu-tools", version.ref = "kaributools" }
kaributools23 = { module = "com.github.mvysny.karibu-tools:karibu-tools-23", version.ref = "kaributools" }
karibudsl = { module = "com.github.mvysny.karibudsl:karibu-dsl", version.ref = "karibudsl" }
karibudsl23 = { module = "com.github.mvysny.karibudsl:karibu-dsl-v23", version.ref = "karibudsl" }
junit-jupiterapi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
vaadin-stable-all = { module = "com.vaadin:vaadin", version.ref = "vaadin" }
vaadin-stable-core = { module = "com.vaadin:vaadin-core", version.ref = "vaadin" }
vaadin-stable-spring = { module = "com.vaadin:vaadin-spring", version.ref = "vaadin_spring" }
vaadin-next-all = { module = "com.vaadin:vaadin", version.ref = "vaadin_next" }
vaadin-next-core = { module = "com.vaadin:vaadin-core", version.ref = "vaadin_next" }
vaadin-next-spring = { module = "com.vaadin:vaadin-spring", version.ref = "vaadin_next_spring" }
classgraph = "io.github.classgraph:classgraph:4.8.184"
# Vaadin Flow brings JSoup in transitively; we depend on it explicitly so LitRenderer HTML
# assertions keep working even if Flow ever drops it. See _getPresentationJsoup().
jsoup = "org.jsoup:jsoup:1.22.2"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
groovy = "org.apache.groovy:groovy:4.0.29"
hibernate-validator = "org.hibernate.validator:hibernate-validator:9.1.0.Final"
jakarta-el-api = "jakarta.el:jakarta.el-api:6.0.1"
jakarta-annotation-api = "jakarta.annotation:jakarta.annotation-api:3.0.0"
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring_boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring_boot" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons", version.ref = "spring_boot" }
spring-security-core = { module = "org.springframework.security:spring-security-core", version.ref = "spring_security" }
fake-servlet5 = "com.github.mvysny.fake-servlet:fake-servlet5:1.3"
