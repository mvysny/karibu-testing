name: Gradle

on: [push, pull_request]

jobs:
  design-docs:
    # The doc-layer tripwires, on an image that has bash and git. The Gradle build runs them too,
    # but skips them on Windows; this job is the guarantee.
    runs-on: ubuntu-latest
    container: buildpack-deps:scm
    steps:
    - uses: actions/checkout@v6
    - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - run: ./design/verify_design_tripwires.sh

  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [21, 25]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: ./gradlew --no-daemon --no-watch-fs

